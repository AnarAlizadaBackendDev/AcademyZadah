<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title, description, image)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        document.documentElement.classList.add('js');
        try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <title th:text="${title} + ' · ' + ${app.brandName()}">Page</title>
    <meta name="description" th:content="${description}">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <meta property="og:site_name" th:content="${app.brandName()}">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:image" th:if="${image != null}" th:content="${app.baseUrl() + image}">
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>

<body>

<header th:fragment="header" class="site-header">
    <div class="container">
        <div class="header-pill">
            <a th:href="@{/}" class="logo">
                <span class="logo-mark">{ }</span>
                <span th:text="${app.brandName()}">Java Academy</span>
            </a>
            <nav class="nav" data-nav>
                <a th:href="@{/#about}" th:text="#{nav.about}">About</a>
                <a th:href="@{/#courses}" th:text="#{nav.courses}">Courses</a>
                <a th:href="@{/blog}" th:text="#{nav.blog}">Blog</a>
                <a th:href="@{/contact}" th:text="#{nav.contact}">Contact</a>
                <a th:if="${me != null and me.admin}" th:href="@{/admin}" th:text="#{nav.admin}">Admin</a>
                <a th:if="${me != null and !me.admin}" th:href="@{/dashboard}" th:text="#{nav.myCourses}">My courses</a>
            </nav>
            <div class="header-actions">
                <div class="seg" data-seg th:style="'--i:' + ${languages.indexOf(currentLang)}">
                    <span class="seg-indicator"></span>
                    <a th:each="l, st : ${languages}" th:href="@{${currentPath}(lang=${l})}" th:text="${#strings.toUpperCase(l)}"
                       th:attr="data-index=${st.index}" th:classappend="${l == currentLang} ? 'active'">AZ</a>
                </div>
                <button class="theme-switch" type="button" data-theme-toggle th:attr="aria-label=#{theme.toggle}">
                    <span class="knob">
                        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
                    </span>
                </button>
                <a th:if="${me == null}" th:href="@{/login}" class="btn btn-sm btn-primary" th:text="#{nav.login}">Login</a>
                <form th:if="${me != null}" th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="btn btn-sm btn-ghost" th:text="#{nav.logout}">Logout</button>
                </form>
                <button class="nav-toggle" type="button" aria-label="Menu" data-nav-toggle><span></span></button>
            </div>
        </div>
    </div>
</header>

<div th:fragment="flash" class="flash-area">
    <div th:if="${flash != null}" class="alert alert-success" th:text="#{${flash}}">Saved</div>
    <div th:if="${error != null}" class="alert alert-error" th:text="#{${error}}">Error</div>
</div>

<nav th:fragment="adminNav(active)" class="admin-nav">
    <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active'" th:text="#{admin.nav.dashboard}">Dashboard</a>
    <a th:href="@{/admin/students}" th:classappend="${active == 'students'} ? 'active'" th:text="#{admin.nav.students}">Students</a>
    <a th:href="@{/admin/courses}" th:classappend="${active == 'courses'} ? 'active'" th:text="#{admin.nav.courses}">Courses</a>
    <a th:href="@{/admin/blog}" th:classappend="${active == 'blog'} ? 'active'" th:text="#{admin.nav.blog}">Blog</a>
    <a th:href="@{/admin/inquiries}" th:classappend="${active == 'inquiries'} ? 'active'" th:text="#{admin.nav.inquiries}">Inquiries</a>
</nav>

<article th:fragment="postCard(p)" class="post-card">
    <a th:href="@{/blog/{slug}(slug=${p.slug})}">
        <div class="post-cover" th:style="${p.coverImage != null} ? 'background-image:url(' + ${p.coverImage} + ')'">
            <span th:if="${p.coverImage == null}" class="post-cover-placeholder">{ }</span>
        </div>
        <div class="post-body">
            <div class="post-meta">
                <span th:text="${p.publishedAt != null} ? ${#temporals.format(p.publishedAt, 'dd.MM.yyyy')} : ''">01.01.2026</span>
                <span class="badge" th:text="${#strings.toUpperCase(p.lang)}">AZ</span>
            </div>
            <h3 th:text="${p.title}">Title</h3>
            <p class="muted" th:text="${p.summary}">Summary</p>
        </div>
    </a>
</article>

<footer th:fragment="footer" class="site-footer">
    <div class="container footer-inner">
        <div>
            <div class="logo"><span class="logo-mark">{ }</span><span th:text="${app.brandName()}">Java Academy</span></div>
            <p class="muted" th:text="#{footer.tagline}">Java courses from a practising senior backend engineer.</p>
        </div>
        <div class="footer-links">
            <a th:if="${!#strings.isEmpty(app.contact().email())}" th:href="'mailto:' + ${app.contact().email()}" th:text="${app.contact().email()}">mail</a>
            <a th:if="${!#strings.isEmpty(app.contact().phone())}" th:href="'tel:' + ${app.contact().phone()}" th:text="${app.contact().phone()}">phone</a>
            <a th:if="${!#strings.isEmpty(app.contact().linkedin())}" th:href="${app.contact().linkedin()}" target="_blank" rel="noopener">LinkedIn</a>
            <a th:if="${!#strings.isEmpty(app.contact().github())}" th:href="${app.contact().github()}" target="_blank" rel="noopener">GitHub</a>
            <a th:if="${!#strings.isEmpty(app.contact().telegram())}" th:href="${app.contact().telegram()}" target="_blank" rel="noopener">Telegram</a>
        </div>
    </div>
    <div class="container footer-bottom muted">
        © <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> <span th:text="${app.ownerName()}">Owner</span>
    </div>
</footer>

</body>
</html>
