<!DOCTYPE html>
<html th:lang="${currentLang}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{account.password.title}, #{account.password.title}, null)}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container page auth">
    <form th:action="@{/account/password}" method="post" class="form card">
        <h1 th:text="#{account.password.title}">Change password</h1>
        <p class="muted" th:text="#{account.password.lead}">Choose your own password.</p>
        <div th:if="${error != null}" class="alert alert-error" th:text="#{${error}}">Error</div>
        <label><span th:text="#{account.password.current}">Current password</span>
            <input type="password" name="currentPassword" required autocomplete="current-password">
        </label>
        <label><span th:text="#{account.password.new}">New password</span>
            <input type="password" name="newPassword" required minlength="8" autocomplete="new-password">
        </label>
        <label><span th:text="#{account.password.confirm}">Repeat new password</span>
            <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password">
        </label>
        <button type="submit" class="btn btn-primary btn-block" th:text="#{account.password.submit}">Save</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
